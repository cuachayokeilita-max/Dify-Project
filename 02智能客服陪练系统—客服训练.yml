    - data:
        code: "import operator                 # 新增\nfrom collections import defaultdict\n\
          \ndef main(ranks: list) -> dict:\n    max_scores = defaultdict(\n      \
          \  lambda: {'employee_id': None, 'customer_service_name': None, 'score':\
          \ 0}\n    )\n    for item in ranks:\n        for data in item['data']:\n\
          \            if data['score'] > max_scores[data['employee_id']]['score']:\n\
          \                max_scores[data['employee_id']] = {\n                 \
          \   'employee_id': data['employee_id'],\n                    'customer_service_name':\
          \ data['customer_service_name'],\n                    'score': data['score']\n\
          \                }\n\n    sorted_scores = sorted(\n        max_scores.values(),\n\
          \        key=operator.itemgetter('score'),\n        reverse=True\n    )\n\
