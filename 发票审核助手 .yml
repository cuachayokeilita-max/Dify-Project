    - data:
        code: "import json\n\ndef main(arg1: str) -> dict:\n    data = arg1\n    passed\
          \ = []\n    failed = []\n    for item in data:\n        if item['is_ok']:\n\
          \            passed.append({k: v for k, v in item.items() if k not in ['is_ok',\
          \ 'reason']})\n        else:\n            failed.append({k: v for k, v in\
          \ item.items() if k != 'is_ok'})\n    \n    def markdown_table(items):\n\
          \        if not items:\n            return '*（无记录）*'\n        headers =\
          \ list(items[0].keys())\n        table = [\"| \" + \" | \".join(headers)\
          \ + \" |\"]\n        table.append(\"|\" + \"|\".join([\"---\"] * len(headers))\
          \ + \"|\")\n        for item in items:\n            row = \" | \" + \" |\
          \ \".join(str(item[k]) for k in headers) + \" |\"\n            table.append(row)\n\
          \        return \"\\n\".join(table)\n    \n    result = f\"通过审核的发票：\\n{markdown_table(passed)}\\\
          n\\n未通过审核的发票：\\n{markdown_table(failed)}\"\n    return {'result': result}"
