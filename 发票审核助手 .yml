          \            is_ok = False\n            reason = '`payer_name`字段有误'\n  \
          \          \n        if temp.get('taxpayer_num', '').strip() != '310456HJK154876297':\n\
          \            is_ok = False\n            reason = '`taxpayer_num`字段有误'\n\
          \            \n        if not any(x in temp.get('project_name', '') for\
          \ x in ['住宿服务', '咨询服务', '餐饮服务', '生活服务', '家政服务', '保洁', '*服装*精品女装A款']):\n\
          \            is_ok = False\n            reason = '`project_name`字段有误'\n\
          \            \n        if temp.get('invoicing_date', '')[:4] < '2021':\n\
          \            is_ok = False\n            reason = '`invoicing_date`字段有误'\n\
          \            \n        if temp.get('tax_num') in [\"40898108\", \"25112000000211955160\"\
