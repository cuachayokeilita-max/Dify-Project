    - data:
        code: "import json\nimport re\n\ndef main(arg1: list, arg2: list) -> dict:\n\
          \    # 关键修复：None 转为空列表，避免不可迭代\n    arg1 = arg1 if arg1 is not None else\
          \ []\n    arg2 = arg2 if arg2 is not None else []\n    \n    result = []\n\
          \    for data_list in [arg1, arg2]:\n        for item in data_list:\n  \
          \          if not item:\n                continue\n            # 提取 ```json\
          \ 代码块\n            json_match = re.search(r'```json\\n(.*?)\\n```', item,\
          \ re.DOTALL)\n            if json_match:\n                json_str = json_match.group(1).strip()\n\
          \            else:\n                json_str = item.strip()\n          \
          \  try:\n                json_data = json.loads(json_str)\n            \
          \    result.append(json_data)\n            except json.JSONDecodeError:\n\
          \                continue\n    return {'result': result}"
